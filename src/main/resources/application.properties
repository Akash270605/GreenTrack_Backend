spring.application.name=GreenTrack

#----------SERVER PORT-----------
# Which port the embedded web server (Tomcat) listens on.
# Default: 8080
server.port=${SERVER_PORT:8080}


# -----------DATABASE CONNECTION---------
# spring.datasource.* configures the MySQL database connection.

#   jdbc:mysql://localhost:3306/greentrack:    Connect to local MySQL, database "greentrack".
#   createDatabaseIfNotExist=true:                      Auto-create database if it doesn't exist.
#   useSSL=false:                                                        Disable SSL (for local dev).
#   allowPublicKeyRetrieval=true:                        Allows public key retrieval for auth.
#   serverTimezone=UTC:                                       Use UTC timezone.    
spring.datasource.url = ${DB_URL:jdbc:mysql://localhost:3306/greentrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#-------- JPA / Hibernate ----------
# spring.jpa.hibernate.ddl-auto=update
#       update:         Spring keep adding new records.
spring.jpa.hibernate.ddl-auto = update


# spring.jpa.open-in-view=false:    Disable "Open Session In View" pattern
sprng.jpa.open-in-view = false

# Hibernate dialect (tells Hibernate which SQL dialect to use)
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect


# Force Hibernate to use UTC timezone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


#--------- FLYWAY (Database Migrations) ----------
# Flyway manages the database schema versioning.
spring.flyway.enabled = true

# Where migration SQL files are.
spring.flyway.locations = classpath:db/migration

# Start from current state.
spring.flyway.baseline-on-migrate = true


# ------ FILE UPLOAD LIMITS ---------
# Max individual file size.
spring.servlet.multipart.max-file-size = 15MB

# Max total request size.
spring.servlet.multipart.max-request-size = 15MB


# ----------- JWT (Json Web Token) SETTINGS -----------
# Secret key for signing JWTs (must be Base64-encoded, 256-bit).
# Generate the secret key if not present
greentrack.security.jwt.secret=${JWT_SECRET:sp9fdUzGeATuu8B+zYPNno81H1ad7cX5cLbfM2kNvqc=}

# Token expiration time in milliseconds (default: 24 hours).
greentrack.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------- SWAGGER / OPENAPI --------
# URL for the OpenAPI JSON.
springdoc.api.docs.path=/api-docs

# URL for the Swagger UI.
springdoc.swagger-ui.path=/swagger-ui.html


# ----------- LOGGING --------
# Log level for the app
logging.level.com.greentrack=${LOG_LEVEL:INFO}


# ---------- ACTUATOR (Monitoring) ---------
# Expose health, info, and metrics endpoints for monitoring.
management.endpoints.web.exposure.include=health,info,metrics